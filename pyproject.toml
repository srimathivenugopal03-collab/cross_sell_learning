[project]
name = "object-counter"
version = "1.0.0"
description = "Hexagonal Architecture ML Object Counter and Prediction Service"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "NielsenIQ Innovation Enablement Candidate" }
]
dependencies = [
    "Flask>=3.0.0",
    "Flask-Limiter>=3.5.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "pymongo>=4.6.0",
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["counter"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::ResourceWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
